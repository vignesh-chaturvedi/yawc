# Diagnostic only, on the fork's diag/autobahn-memory branch; never part of a PR.
#
# Runs the Linux job of tests.yaml unchanged, four copies with PyPy's default nursery
# and four with PYPY_GC_NURSERY=4M for wstest, recording the CPU, memory every
# 5 seconds, and the kernel's and systemd-oomd's view of any kill.
name: Autobahn memory

on:
  push:
    branches: [diag/autobahn-memory]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        nursery: [default, 4M]
        copy: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    env:
      # Passed to wstest by the Autobahn scripts; empty leaves PyPy's own choice.
      PYPY_GC_NURSERY: ${{ matrix.nursery != 'default' && matrix.nursery || '' }}

    steps:
      - name: System
        run: |
          grep -m1 'model name' /proc/cpuinfo
          grep -m1 'cache size' /proc/cpuinfo
          echo "PYPY_GC_NURSERY=[$PYPY_GC_NURSERY]"
          nproc
          free -m
          swapon --show
          df -h /dev/shm
          uname -r
          echo "step oom_score_adj: $(cat /proc/self/oom_score_adj)"
          systemctl is-active systemd-oomd || true
          systemctl show docker.service -p MemoryMax || true
          cat /sys/fs/cgroup/system.slice/memory.max 2>/dev/null || true
          cat /proc/pressure/memory || true
      - name: Sample memory
        run: |
          nohup bash -c 'while true; do
            echo "== $(date -u +%T)"
            free -m | sed -n 2,3p
            df -m /dev/shm | sed -n 2p
            ps -eo pid,rss,comm --sort=-rss | sed -n 2,6p
            sleep 5
          done' > /tmp/memory.log 2>&1 &
      - uses: actions/checkout@v3
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          targets: wasm32-unknown-unknown
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build
        run: cargo build --verbose --all-features --all-targets
      - name: Test
        run: cargo test --verbose
      - name: Test zlib
        run: cargo test --verbose --features zlib
      - name: Test axum
        run: cargo test --verbose --features axum,zlib
      - name: Test http2
        run: cargo test --verbose --features http2,axum
      - name: Test without TLS
        run: cargo test --verbose --no-default-features --features axum,http2,reqwest
      - name: Test custom TLS
        run: cargo test --verbose --no-default-features --features tls,axum,http2
      - name: Check isolated TLS features
        run: |
          cargo check --lib --no-default-features --features axum,http2,reqwest
          cargo check --lib --no-default-features --features tls
          cargo check --lib --no-default-features --features rustls-aws-lc-rs
      - name: Test WASM
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --lib --target wasm32-unknown-unknown --no-default-features
          env WASM_BINDGEN_USE_BROWSER=1 wasm-pack test --headless --chrome --lib
          wasm-pack test --node --lib
      - name: Autobahn|Testsuite client (with zlib)
        timeout-minutes: 20
        run: |
          deno run -A --unstable autobahn/client-test.js zlib
      - name: Autobahn|Testsuite server (with zlib)
        timeout-minutes: 40
        run: |
          deno run -A --unstable autobahn/server-test.js zlib
      - name: Memory log
        if: always()
        run: |
          cat /tmp/memory.log
          echo "== kernel"
          sudo dmesg -T | grep -A400 'invoked oom-killer' \
            | grep -E 'invoked oom|\[  pid  \]|\] \[ *[0-9]+\]|Killed process' || true
          echo "== systemd-oomd"
          journalctl -u systemd-oomd --no-pager | tail -n 50 || true
          cat /proc/pressure/memory || true
